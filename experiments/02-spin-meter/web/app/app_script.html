<style>
.update { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 10;
  width: min(560px, calc(100% - 32px)); display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
.update p { flex: 1 1 200px; }
.update .row { gap: 8px; flex-wrap: nowrap; }
.update .btn.ghost { color: var(--bg); border-color: currentColor; }
.install { display: grid; gap: 10px; justify-items: start; background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; }
</style>
<div class="update" id="update" role="status" hidden>
  <p id="update-text">A new version is ready.</p>
  <div class="row">
    <button class="btn ghost" id="update-later" type="button">Later</button>
    <button class="btn" id="update-reload" type="button">Reload</button>
  </div>
</div>
<span id="app-build" data-build="__APP_BUILD__" hidden></span>
<script>
// App build only: offline support, the install button, and videos shared from other apps.
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  // install: Chrome/Android offers a prompt; iPhone needs Share → Add to Home Screen
  let deferred = null;
  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); deferred = e;
    $("install").hidden = false; $("install-btn").hidden = false;
  });
  $("install-btn").addEventListener("click", async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice.catch(() => null);
    deferred = null; $("install").hidden = true;
  });
  addEventListener("appinstalled", () => { $("install").hidden = true; });
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (ios && !standalone) {
    $("install").hidden = false;
    $("install-text").textContent = "Add Spin Meter to your home screen: tap Share, then Add to Home Screen. It opens like an app and works offline.";
  }
  if (standalone) document.querySelectorAll("[data-app-hint]").forEach((el) => (el.hidden = false));

  // a video shared from Photos (or any app) lands here via the service worker
  async function takeShared() {
    if (!new URLSearchParams(location.search).has("shared")) return;
    history.replaceState(null, "", location.pathname);
    try {
      const c = await caches.open("shared"), r = await c.match("shared-video");
      if (!r) return;
      const blob = await r.blob(), name = decodeURIComponent(r.headers.get("x-file-name") || "shared.mp4");
      await c.delete("shared-video");
      await window.SpinPage.analyseFile(new File([blob], name, { type: blob.type || "video/mp4" }));
    } catch (e) {
      const el = $("error"); el.textContent = "The shared video could not be opened. Pick it with the button instead."; el.hidden = false;
    }
  }
  takeShared();

  // updates: when the app comes back to the screen (and every 30 min while open), ask the
  // server which build is current; if it isn't this one, offer a reload.
  const mine = (document.getElementById("app-build") || {}).dataset || {};
  let offered = false;
  async function checkUpdate() {
    if (offered || !navigator.onLine) return;
    try {
      const r = await fetch("version.json", { cache: "no-store" });
      if (!r.ok) return;
      const v = await r.json();
      if (v.build && v.build !== mine.build) {
        offered = true;
        $("update-text").textContent = `A new version (${v.version}) is ready.`;
        $("update").hidden = false;
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration)
          navigator.serviceWorker.getRegistration().then((reg) => reg && reg.update()).catch(() => {});
      }
    } catch (e) { /* offline or blocked: try again later */ }
  }
  $("update-reload").addEventListener("click", () => location.reload());
  $("update-later").addEventListener("click", () => { $("update").hidden = true; });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
  addEventListener("online", checkUpdate);
  setInterval(checkUpdate, 30 * 60 * 1000);
  setTimeout(checkUpdate, 3000);
})();
</script>
