# Publishes the Serve Spin Meter web app (experiments/02-spin-meter/web/dist/app) to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Spin Meter app (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["experiments/02-spin-meter/web/**", ".github/workflows/spin-meter-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 experiments/02-spin-meter/web/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/02-spin-meter/web/dist/app
      - id: deployment
        uses: actions/deploy-pages@v4
