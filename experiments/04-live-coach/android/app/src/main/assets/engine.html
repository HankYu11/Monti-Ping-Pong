<!doctype html>
<meta charset="utf-8">
<title>engine</title>
<!-- The spin meter's own engine (experiments/02-spin-meter/web/engine.js, copied in by the build)
     and mp4box.js, run headless in the app's WebView: one clip in, the reading and coaching out. -->
<script src="mp4box.all.min.js"></script>
<script src="engine.js"></script>
<script>
  const pick = (r) => r && {
    phase: r.phase, rps: r.rps, rpm: r.rpm, type: r.spinType, clear: !!r.reliable, error: r.error || null,
    // the spin split, for the HUD's spin ball: lift is back (+) or top (-), curve bends right (+)
    // or left (-), gyro is signed and points away down the table when positive. marking says
    // whether the colour dots were read, which is what makes gyro's direction worth drawing.
    lift: r.lift, curve: r.curve, gyro: r.gyro, marking: r.marking, gyroDirKnown: !!r.gyroDirKnown,
    fit: r.fit, speed: r.flight && r.flight.launchSpeed, toward: r.flight && r.flight.towardCameraDeg,
    frames: r.nFrames, issues: (r.issues || []).map((i) => i.text), ballPx: r.ballRadiusPx ? 2 * r.ballRadiusPx : undefined,
  };
  // For the training data (0.8.3): each measured stretch in full, without the ball images. The
  // search's track is the ball in every frame ([frame, x, y, r] at half size in the crop).
  const round = (v, d = 3) => (typeof v === "number" ? +v.toFixed(d) : Array.isArray(v) ? v.map((x) => round(x, d)) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, round(x, d)])) : v);
  const dataOf = (r) => r && round({
    phase: r.phase, error: r.error || null, rps: r.rps, type: r.spinType, reliable: !!r.reliable, fit: r.fit, runnerUp: r.runnerUp,
    plusMinusRps: r.plusMinusRps, turns: r.turns, marking: r.marking, axis: r.axis, camAxis: r.camAxis,
    lift: r.lift, curve: r.curve, gyro: r.gyro, tilt: r.tilt, flight: r.flight, ballRadiusPx: r.ballRadiusPx, nFrames: r.nFrames,
    segment: r.segment && { kind: r.segment.kind, start: r.segment.start, end: r.segment.end, hit: r.segment.hit, roi: r.segment.roi,
      track: r.segment.track, toss: r.segment.toss },
  });
  async function analyse(url, id) {
    const t0 = performance.now();
    try {
      const blob = await (await fetch(url)).blob();
      const res = await window.SpinMeter.analyze(new File([blob], "serve.mp4"), {
        captureFps: 240, serveDir: "any", single: true, robust: true,
        onProgress: (step, frac) => Android.onProgress(id, String(step), +frac || 0),
      });
      const sv = (res.serves || [])[0];
      const coach = sv ? window.SpinMeter.coach(sv) : { kind: "none", reason: "reading" };
      const dbg = (res.meta && res.meta.debug) || {};
      Android.onResult(id, JSON.stringify({
        ms: performance.now() - t0, error: sv ? null : (res.error || "No serve found."),
        serve: sv ? Object.assign(pick(sv), { phases: (sv.phases || []).map(pick), notes: (sv.notes || []).map((n) => n.text) }) : null,
        coach, frames: res.meta && res.meta.nFrames, engineSeconds: res.meta && res.meta.seconds,
        time: dbg.time, read: dbg.read, decoder: dbg.decoder, workers: dbg.workers,
      }));
    } catch (e) {
      Android.onResult(id, JSON.stringify({ ms: performance.now() - t0, error: "engine: " + (e && e.message ? e.message : e) }));
    }
  }
  // a serve the app spotted: frames fetched one at a time from the app as the engine needs them
  async function analyseCapture(base, id) {
    const t0 = performance.now();
    try {
      // The first header (the frame count estimated) comes as soon as the capture starts being cut;
      // the frames are read while they are cut (each read waits for its frames), then the last
      // header (its count and colour range). 0.8.2: before, all were cut first, then read.
      let head = await (await fetch(`${base}/head`)).json();
      // All the frames in memory, fetched in chunks of 24 (one request each). Before 0.6.2 a capture
      // over 160 MB was read a frame at a time, again on every pass: 13-15 s instead of 2-6.
      const [, , cw, ch] = head.rect, per = cw * ch + 2 * (cw >> 1) * (ch >> 1);
      let frames = null, frame = null, win = null;
      // A windowed capture is a background frame, then every frame's row brightness, then a small
      // window round the ball -- about a fiftieth of the bytes. It is fetched whole in one go
      // rather than in chunks as it is written: chunking exists so the engine can start on a
      // 287 MB crop while the phone is still cutting it, and at 6 MB there is nothing left to
      // overlap. head/final waits for the writer, so by then the file is complete.
      if (head.windowed) {
        head = await (await fetch(`${base}/head/final`)).json();
        const b = new Uint8Array(await (await fetch(`${base}/all`)).arrayBuffer());
        const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
        let o = 0;
        win = { background: b.subarray(o, o + per), rowBright: [], windows: head.windows, winW: head.winW, winH: head.winH };
        o += per;
        for (let i = 0; i < head.n; i++) {
          const r = new Float32Array(ch);
          for (let y = 0; y < ch; y++) { r[y] = dv.getFloat32(o); o += 4; }
          win.rowBright.push(r);
        }
        const wb = head.winW * head.winH + 2 * ((head.winW >> 1) * (head.winH >> 1));
        frames = [];
        for (let i = 0; i < head.n; i++) {
          if (!head.windows[i]) { frames.push(null); continue; }
          frames.push(b.subarray(o, o + wb)); o += wb;
        }
      } else if (per * head.n <= 600e6) {
        frames = [];
        const chunk = async (k) => {
          const buf = await (await fetch(`${base}/frames/${k}/24`)).arrayBuffer();
          for (let j = 0; (j + 1) * per <= buf.byteLength; j++) frames.push(new Uint8Array(buf, j * per, per));
          return buf.byteLength;
        };
        for (let k = 0; k < head.n; k += 24) if (!(await chunk(k))) break;
        head = await (await fetch(`${base}/head/final`)).json();
        while (frames.length < head.n && frames.length % 24 === 0 && (await chunk(frames.length))) {}
      } else {
        head = await (await fetch(`${base}/head/final`)).json();
        frame = async (k) => new Uint8Array(await (await fetch(`${base}/${k}`)).arrayBuffer());
      }
      if (frames && frames.length > head.n) frames.length = head.n;
      const tFetch = performance.now() - t0;
      const res = await window.SpinMeter.measureCapture(Object.assign({ W: head.W, H: head.H, rect: head.rect, n: frames ? frames.length : head.n, frames, frame, full: head.full, fps: head.fps, track: head.track, near: head.near }, win || {}), {
        // Measure along the live tracker's own tracks instead of searching the crop: about 3x
        // faster over the 21 recorded captures (97.7 s -> 33.0 s). The engine declines a track
        // it shouldn't measure -- one that doesn't fly like a ball, one that measures to nothing
        // or to an unclear reading, and one that only ever sees the ball after the bounce -- and
        // searches the crop instead, as it always has. Five of the 21 take that path (L1, M6,
        // N12, N15, T4_2) and all five then read what the search alone reads.
        useTrack: true,
        single: true, serveDir: "any", robust: true, onProgress: (step, frac) => Android.onProgress(id, String(step), +frac || 0),
      });
      const sv = (res.serves || [])[0];
      const coach = sv ? window.SpinMeter.coach(sv) : { kind: "none", reason: "reading" };
      const dbg = (res.meta && res.meta.debug) || {};
      Android.onResult(id, JSON.stringify({
        ms: performance.now() - t0, error: sv ? null : (res.error || "No serve found."),
        serve: sv ? Object.assign(pick(sv), { phases: (sv.phases || []).map(pick), notes: (sv.notes || []).map((n) => n.text) }) : null,
        coach, frames: head.n, crop: head.rect, fetchMs: Math.round(tFetch), net: !!res.net, skipped: res.skipped || null,
        data: sv ? { phases: (sv.phases || []).map(dataOf), notes: (sv.notes || []).map((n) => n.text) } : null, usedTrack: !!(dbg.trackGiven && !dbg.trackRefused), trackRefused: dbg.trackRefused || false,
        // what the track said before it was given up, so a report shows whether the search
        // that replaced it was worth its seconds rather than leaving that to be argued
        trackSaid: dbg.trackSaid || null, trackUnclear: !!dbg.trackUnclear, engineSeconds: res.meta && res.meta.seconds, time: dbg.time, search: dbg.search && dbg.search.serves,
      }));
    } catch (e) {
      Android.onResult(id, JSON.stringify({ ms: performance.now() - t0, error: "engine: " + (e && e.message ? e.message : e) }));
    }
  }
  Android.onReady(typeof VideoDecoder !== "undefined", typeof MP4Box !== "undefined", !!window.SpinMeter);
</script>
